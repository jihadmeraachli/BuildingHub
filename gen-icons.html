<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Icon renderer — the same technique Logo.tsx uses (gradient painted through
     the alpha mask), so icons are pixel-faithful to the in-app brand.
     Background = the login-screen gradient Jey picked as the reference look. */
  body { margin: 0; background: transparent; }
  .tile {
    background: linear-gradient(150deg, oklch(0.32 0.11 185) 0%, oklch(0.2 0.05 186) 45%, oklch(0.13 0.03 190) 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .mark {
    background: linear-gradient(160deg, #7FE8DC 0%, #C9E8E2 55%, #F2FAF8 100%);
    -webkit-mask-image: url(./public/logo-mask.png);
    mask-image: url(./public/logo-mask.png);
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
  }
  /* App icon: mark at 60% of tile. iOS rounds the corners itself. */
  #icon1024 { width: 1024px; height: 1024px; } #icon1024 .mark { width: 614px; height: 614px; }
  #icon512  { width: 512px;  height: 512px;  } #icon512  .mark { width: 307px; height: 307px; }
  #icon192  { width: 192px;  height: 192px;  } #icon192  .mark { width: 115px; height: 115px; }
  #icon180  { width: 180px;  height: 180px;  } #icon180  .mark { width: 108px; height: 108px; }
  /* Splash: quiet — small mark centered on the same gradient. */
  #splash   { width: 2732px; height: 2732px; } #splash .mark { width: 430px; height: 430px; }
  /* Email header logo: mark only, TRANSPARENT background (light-gradient mark
     for the dark teal email header). Shot with omitBackground. */
  #emailLogo { width: 128px; height: 128px; background: none; }
  #emailLogo .mark { width: 128px; height: 128px; }
</style>
</head>
<body>
  <div class="tile" id="icon1024"><div class="mark"></div></div>
  <div class="tile" id="icon512"><div class="mark"></div></div>
  <div class="tile" id="icon192"><div class="mark"></div></div>
  <div class="tile" id="icon180"><div class="mark"></div></div>
  <div class="tile" id="splash"><div class="mark"></div></div>
  <div class="tile" id="emailLogo"><div class="mark"></div></div>
</body>
</html>
